name: Deploy Frontend
on:
  push:
    branches:
      - develop
    paths:
      - '**'

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Deploy via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          # Copia il contenuto della cartella 'dist' generata dalla build
          source: "dist/*"
          # Percorso esatto su aaPanel
          target: "/www/wwwroot/shitwithfriends.dinonerd.it"
          # Rimuove 'dist/' dal percorso (1 livello)
          strip_components: 1
